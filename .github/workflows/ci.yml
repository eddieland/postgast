name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel in-progress runs for the same PR; let every main/master push run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"

      - name: Set up Python
        run: uv python install

      # Skip native build — lint job doesn't need the compiled library.
      - name: Install all dependencies
        run: uv sync --all-groups
        env:
          POSTGAST_SKIP_NATIVE_BUILD: "1"

      - name: Check formatting (mdformat)
        run: uv run mdformat --check README.md CLAUDE.md AGENTS.md openspec/

      - name: Check spelling (codespell)
        run: uv run codespell src tests recipes README.md CLAUDE.md AGENTS.md openspec/

      - name: Lint (ruff)
        run: |
          uv run ruff check src tests recipes
          uv run ruff format --check src tests recipes

      - name: Type check (basedpyright)
        run: uv run basedpyright --stats src tests recipes

  test:
    name: "Test (py${{ matrix.python-version }}, ${{ matrix.os }})"
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # All supported Python versions on Linux (cheapest runners).
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          # Oldest + newest Python on macOS (ARM, Apple Silicon).
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
          # Oldest + newest Python on Windows.
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      # Skip native build during uv sync — build isolation prevents the hatch
      # hook from accessing platform build tools (nmake on Windows). The native
      # library is built explicitly in the next steps instead.
      # Only install the test group — lint-only tools (basedpyright, ruff, etc.)
      # and non-test groups (docs, recipes) are not needed here.
      - name: Install test dependencies
        run: uv sync --no-default-groups --group test
        env:
          POSTGAST_SKIP_NATIVE_BUILD: "1"

      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Build native library (Linux/macOS)
        if: runner.os != 'Windows'
        run: make build-native

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd vendor/libpg_query
          cl -I. -I./vendor -I./src/postgres/include -I./src/include -I./src/postgres/include/port/win32 -I./src/postgres/include/port/win32_msvc /c src/*.c src/postgres/*.c vendor/protobuf-c/protobuf-c.c vendor/xxhash/xxhash.c protobuf/pg_query.pb-c.c
          link /DLL /DEF:../../pg_query_exports.def /OUT:pg_query.dll *.obj
          Copy-Item pg_query.dll ../../src/postgast/pg_query.dll

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  protobuf-compat:
    name: "Protobuf compat (${{ matrix.leg }})"
    needs: lint
    # Protobuf runtime compatibility is not platform-dependent, so one OS is enough.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Neither protobuf version is written down here: both are resolved from the protobuf declaration in
          # pyproject.toml, so changing the floor there changes what this job exercises with no edit to this workflow.
          #
          # Only protobuf moves. Lowering *every* direct dependency (a bare `--resolution lowest-direct` over the whole
          # environment) makes a red leg ambiguous — it could be any dependency's floor — and it forced an invented
          # `psycopg[binary]` lower bound just to keep the resolution installable. Both legs therefore resolve the rest
          # of the environment normally and move protobuf alone, so a failure here always names protobuf.
          #
          # The legs need `tomllib` to read the specifier out of pyproject.toml, so neither runs on 3.10. Python
          # coverage is the `test` matrix's job; this one is about protobuf versions.
          - leg: floor
            python-version: "3.12"
          # Deliberately unpinned, and deliberately not continue-on-error: if a new protobuf release breaks postgast,
          # this leg turning red with no change to the repository is the signal the job exists to raise.
          - leg: latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      - name: Install test dependencies
        run: uv sync --no-default-groups --group test
        env:
          POSTGAST_SKIP_NATIVE_BUILD: "1"

      - name: Build native library
        run: make build-native

      # Reads the protobuf requirement straight out of pyproject.toml, so the version this leg exercises tracks the
      # declaration with no edit here. The floor leg resolves that specifier downward (skipping yanked releases, so it
      # lands on the lowest *installable* version); the latest leg ignores it and takes the newest release.
      - name: Move protobuf to this leg's version
        run: |
          set -euo pipefail
          if [ "${{ matrix.leg }}" = "floor" ]; then
            spec=$(uv run --no-sync python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              deps = tomllib.load(fh)['project']['dependencies']
          print(next(d for d in deps if d.replace('_', '-').lower().startswith('protobuf')))
          ")
            echo "floor leg: resolving '$spec' downward"
            # --reinstall-package is load-bearing: `uv sync` above already installed a protobuf that satisfies the
            # specifier, and without it uv would leave that version in place and this leg would silently test the
            # synced version instead of the floor.
            uv pip install --resolution lowest-direct --reinstall-package protobuf "$spec"
          else
            echo "latest leg: taking the newest protobuf release"
            uv pip install --upgrade protobuf
          fi

      - name: Report resolved protobuf version
        run: |
          uv run --no-sync python -c \
            "from google.protobuf import __version__; print(f'protobuf runtime: {__version__}')"

      # --no-sync so the version pinned above is not re-resolved away before the suite runs.
      - name: Run tests
        run: uv run --no-sync pytest -m "not fuzz"
